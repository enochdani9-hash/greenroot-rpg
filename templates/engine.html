<script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const creationUI = document.getElementById("creation-ui");
        const gameContainer = document.getElementById("game-container");
        const dialogueUI = document.getElementById("dialogue-ui");

        // PRE-LOAD ASSETS
        const bgImage = new Image();
        bgImage.src = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80"; 
        
        const heroImage = new Image(); 
        const oracleImage = new Image();
        oracleImage.src = "https://images.unsplash.com/photo-1541535881962-3bb3ecbb3bbb?auto=format&fit=crop&w=150&q=80";

        // Game Objects - Now with Combat Stats!
        let player = { 
            name: "", charClass: "", x: 100, y: 350, w: 80, h: 80, 
            speed: 5, color: "#8b0000", hp: 100, 
            direction: 1, attacking: 0, attackCooldown: 0 
        };
        let oracle = { 
            name: "The Blind Oracle", x: 750, y: 320, w: 90, h: 90, 
            color: "#5a3a78", hp: 100, isDead: false 
        };
        
        let gameState = "playing"; 

        // Universal Keyboard Tracker
        const keys = {};
        window.addEventListener("keydown", (e) => {
            if(e.key === " ") e.preventDefault(); // Stop spacebar from scrolling page
            keys[e.key.toLowerCase()] = true;
            keys[e.code] = true; // Capture spacebar safely
        });
        window.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
            keys[e.code] = false;
        });

        canvas.addEventListener("click", () => canvas.focus());

        function startGame() {
            player.name = document.getElementById("heroName").value || "Wanderer";
            player.charClass = document.getElementById("heroClass").value;

            if (player.charClass === "knight") {
                heroImage.src = "https://images.unsplash.com/photo-1605639732731-9a7493a38a7c?auto=format&fit=crop&w=150&q=80";
                player.color = "#4a4a4a";
            } else if (player.charClass === "rogue") {
                heroImage.src = "https://images.unsplash.com/photo-1509460913899-515f1df34fac?auto=format&fit=crop&w=150&q=80";
                player.speed = 7;
                player.color = "#1c3d5a";
            } else {
                heroImage.src = "https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?auto=format&fit=crop&w=150&q=80";
                player.color = "#2e4a2e";
            }

            creationUI.style.display = "none";
            gameContainer.style.display = "block";
            canvas.focus(); 
            
            requestAnimationFrame(engineLoop);
        }

        function engineLoop() {
            if (gameState === "playing") updatePhysics();
            renderGraphics();
            requestAnimationFrame(engineLoop);
        }

        function updatePhysics() {
            // Movement & Direction Tracking
            if (keys["w"] && player.y > 250) player.y -= player.speed; 
            if (keys["s"] && player.y < canvas.height - player.h) player.y += player.speed;
            if (keys["a"] && player.x > 0) { player.x -= player.speed; player.direction = -1; }
            if (keys["d"] && player.x < canvas.width - player.w) { player.x += player.speed; player.direction = 1; }

            // Combat Logic (Press Spacebar to Attack)
            if (player.attackCooldown > 0) player.attackCooldown--;
            
            if (keys["space"] && player.attackCooldown === 0) {
                player.attacking = 10; // Sword flash lasts 10 frames
                player.attackCooldown = 30; // Wait 30 frames before next swing
                
                // Did the sword hit?
                let dist = Math.hypot(player.x - oracle.x, player.y - oracle.y);
                if (dist < 130 && !oracle.isDead) {
                    oracle.hp -= 34; // 3 hits to kill
                    if (oracle.hp <= 0) {
                        oracle.isDead = true;
                        oracle.name = "Slain Oracle";
                        oracle.color = "#222"; // Turn grey when defeated
                    }
                }
            }
            if (player.attacking > 0) player.attacking--;

            // Dialogue Interaction
            let dist = Math.hypot(player.x - oracle.x, player.y - oracle.y);
            if (dist < 120 && keys["e"] && !oracle.isDead) {
                gameState = "dialogue";
                dialogueUI.style.display = "block";
                keys["e"] = false; 
            }
        }

        function closeDialogue() {
            gameState = "playing";
            dialogueUI.style.display = "none";
            player.x -= 30; 
            canvas.focus();
        }

        function drawToken(img, x, y, w, h, fallbackColor) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x + (w/2), y + (h/2), w/2, 0, Math.PI * 2, true);
            
            if (img.complete && img.naturalWidth > 0) {
                ctx.clip();
                ctx.drawImage(img, x, y, w, h);
            } else {
                ctx.fillStyle = fallbackColor;
                ctx.fill();
            }
            ctx.restore();
            
            ctx.strokeStyle = "#a39171";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x + (w/2), y + (h/2), w/2, 0, Math.PI * 2, true);
            ctx.stroke();
        }

        function renderGraphics() {
            try {
                // Environment
                if (bgImage.complete && bgImage.naturalWidth > 0) {
                    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw NPC & Health Bar
                if (oracle.isDead) ctx.globalAlpha = 0.5; // Make corpse transparent
                drawToken(oracleImage, oracle.x, oracle.y, oracle.w, oracle.h, oracle.color);
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = "#e6d8c3"; ctx.font = "bold 14px 'Palatino Linotype'"; ctx.textAlign = "center";
                ctx.fillText(oracle.name, oracle.x + (oracle.w / 2), oracle.y - 10);
                
                if (!oracle.isDead) {
                    ctx.fillStyle = "#000"; ctx.fillRect(oracle.x, oracle.y - 20, oracle.w, 5);
                    ctx.fillStyle = "#8b0000"; ctx.fillRect(oracle.x, oracle.y - 20, oracle.w * (oracle.hp/100), 5);
                }

                // Draw Player
                drawToken(heroImage, player.x, player.y, player.w, player.h, player.color);
                ctx.fillStyle = "#e6d8c3"; 
                ctx.fillText(player.name, player.x + (player.w / 2), player.y - 15);

                // Draw Attack Animation (Sword Slash)
                if (player.attacking > 0) {
                    ctx.fillStyle = "#ffffff";
                    let slashX = player.direction === 1 ? player.x + player.w : player.x - 20;
                    ctx.fillRect(slashX, player.y + 30, 20, 50);
                }

                // Interaction Prompt
                if (gameState === "playing" && !oracle.isDead) {
                    let dist = Math.hypot(player.x - oracle.x, player.y - oracle.y);
                    if (dist < 120) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 18px 'Palatino Linotype'";
                        ctx.fillText("[Press E to Speak]", player.x + (player.w/2), player.y - 35);
                    }
                }
            } catch (err) {
                console.error("Render Error: ", err);
            }
        }
    </script>
