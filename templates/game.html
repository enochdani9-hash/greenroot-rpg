<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Immersive RPG</title>
    <style>
        body {
            background-color: #111;
            color: #ddd;
            font-family: 'Georgia', serif; /* A more literary, storytelling font */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .story-container {
            max-width: 600px;
            width: 100%;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-top: 4px solid #8a2be2;
        }
        .header {
            display: flex;
            justify-content: space-between;
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .character-name {
            color: #8a2be2;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .story-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .choice-btn {
            display: block;
            width: 100%;
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            font-family: inherit;
        }
        .choice-btn:hover {
            background: #333;
            border-color: #8a2be2;
            padding-left: 20px; /* Slight indent animation on hover */
        }
    </style>
</head>
<body>

<div class="story-container">
    <div class="header">
        <span>📍 {{ scene.location }}</span>
        <span>❤️ HP: {{ session.hp }} | 🤝 Trust: {{ session.trust }}</span>
    </div>
    
    <div class="character-name">{{ scene.character }}</div>
    <div class="story-text">
        {{ scene.text }}
    </div>

    <form action="/make_choice" method="POST">
        {% for choice in scene.choices %}
            <button type="submit" name="choice_index" value="{{ loop.index0 }}" class="choice-btn">
                > {{ choice.text }}
            </button>
        {% endfor %}
    </form>
</div>

</body>
</html>
