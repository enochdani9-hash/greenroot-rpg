<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ashen Path</title>
    <style>
        /* Dark Fantasy Aesthetic */
        body {
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: #c4b5a3; /* Parchment/bone text color */
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; /* Elegant, classic serif */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .story-container {
            max-width: 650px;
            width: 100%;
            background: rgba(15, 15, 15, 0.9);
            padding: 40px;
            border-radius: 4px;
            border: 1px solid #332b22;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Top Status Bar */
        .header {
            display: flex;
            justify-content: space-between;
            font-family: 'Cinzel', 'Trajan Pro', serif; /* Narrow, traditional feel */
            font-size: 0.9rem;
            color: #8c7b66;
            border-bottom: 1px solid #332b22;
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-group { display: flex; gap: 15px; }
        .stat-hp { color: #8b0000; } /* Blood red */
        .stat-corruption { color: #5a3a78; } /* Sickly purple */

        /* The Narrative Text */
        .character-name {
            color: #a39171;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-style: italic;
        }

        .story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* The Choices */
        .choice-btn {
            display: block;
            width: 100%;
            background: #141414;
            color: #c4b5a3;
            border: 1px solid #332b22;
            padding: 18px 20px;
            margin-bottom: 12px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            background: #1a1a1a;
            border-color: #5a4b38;
            color: #e6d8c3;
            padding-left: 25px; /* Subtle indent */
            box-shadow: 0 0 10px rgba(90, 75, 56, 0.2);
        }

        /* A subtle styling touch for the arrow */
        .choice-btn::before {
            content: '❖';
            color: #5a4b38;
            margin-right: 10px;
            font-size: 0.9em;
            transition: color 0.3s ease;
        }
        
        .choice-btn:hover::before {
            color: #8b0000;
        }
    </style>
</head>
<body>

<div class="story-container">
    <!-- Top Bar -->
    <div class="header">
        <span>♱ {{ scene.location }}</span>
        <div class="stat-group">
            <span class="stat-hp">Blood: {{ session.hp }}</span>
            <span class="stat-corruption">Corruption: {{ session.corruption }}</span>
        </div>
    </div>
    
    <!-- Narrative Focus -->
    {% if scene.character != "None" %}
        <div class="character-name">{{ scene.character }}</div>
    {% endif %}
    
    <div class="story-text">
        {{ scene.text }}
    </div>

    <!-- Interactive Choices -->
    <form action="/make_choice" method="POST">
        {% for choice in scene.choices %}
            <button type="submit" name="choice_index" value="{{ loop.index0 }}" class="choice-btn">
                {{ choice.text }}
            </button>
        {% endfor %}
    </form>
</div>

</body>
</html>
