<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Forge: Cyber-Hack</title>
    <style>
        body {
            background-color: #0d1117; /* Deep space dark blue/grey */
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(22, 27, 34, 0.8);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        h1 {
            color: #00ffff; /* Neon Cyan */
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        p {
            color: #ff00ff; /* Neon Magenta */
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #ff00ff;
        }

        input[type="text"] {
            background: #0d1117;
            border: 2px solid #30363d;
            color: #00ffff;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            width: 80%;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        button {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2) inset;
        }

        button:hover {
            background: #00ffff;
            color: #0d1117;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Word Forge</h1>
        <p>// INITIATE PROTOCOL //</p>
        <form action="/start" method="POST">
            <input type="text" name="name" placeholder="ENTER CODENAME" required autocomplete="off">
            <br>
            <button type="submit">Initialize Link</button>
        </form>
    </div>
</body>
</html>
