<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ashen Path</title>
    <style>
        body {
            background-color: #050505;
            color: #c4b5a3;
            font-family: 'Palatino Linotype', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            color: #a39171;
            margin-bottom: 5px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: normal;
            border-bottom: 1px solid #332b22;
            padding-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #665b4c;
            margin-bottom: 40px;
            font-style: italic;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 1px solid #5a4b38;
            color: #c4b5a3;
            padding: 10px;
            font-size: 1.5rem;
            text-align: center;
            font-family: inherit;
            outline: none;
            width: 300px;
        }
        
        input[type="text"]::placeholder { color: #332b22; }

        button {
            background: #141414;
            color: #a39171;
            border: 1px solid #5a4b38;
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #1a1a1a;
            color: #e6d8c3;
            border-color: #a39171;
            box-shadow: 0 0 15px rgba(163, 145, 113, 0.2);
        }
        
        .death-msg { color: #8b0000; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>The Ashen Path</h1>
    <p>"In the dark, all souls burn the same."</p>
    
    {% if message %}
        <div class="death-msg">{{ message }}</div>
    {% endif %}

    <form class="input-group" action="/start" method="POST">
        <input type="text" name="name" placeholder="Name your Wanderer" required autocomplete="off">
        <button type="submit">Enter the Woods</button>
    </form>
</body>
</html>
